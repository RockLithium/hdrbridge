plugins { id 'com.android.application' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def coreVersion = file('../../VERSION').text.trim()
def versionParts = coreVersion.tokenize('.')
if (!(coreVersion ==~ /\d+\.\d+\.\d+/) ||
        versionParts.any { it.toInteger() > 999 }) {
    throw new GradleException('VERSION must contain major.minor.patch with components from 0 to 999')
}
def coreVersionCode = versionParts[0].toInteger() * 1000000 +
        versionParts[1].toInteger() * 1000 + versionParts[2].toInteger()
def signingPath = System.getenv('HDRBRIDGE_ANDROID_SIGNING_PROPERTIES') ?: '.local-signing/release.properties'
def signingFile = rootProject.file(signingPath)
def releaseKeys = new Properties()
if (signingFile.exists()) signingFile.withInputStream { releaseKeys.load(it) }
def releasePin = rootProject.file('signing/release-cert-sha256.txt').text.trim()
if (!(releasePin ==~ /[0-9a-fA-F]{64}/))
    throw new GradleException('Invalid Android release certificate pin')
android {
    namespace 'org.hdrbridge'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '30.0.16248370'
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            def localKey = rootProject.file('.local-signing/debug.keystore')
            if (localKey.exists()) storeFile = localKey
        }
        production {
            if (!releaseKeys.isEmpty()) {
                ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each {
                    if (!releaseKeys.getProperty(it)) throw new GradleException("Missing Android signing property: $it")
                }
                storeFile rootProject.file(releaseKeys.getProperty('storeFile'))
                storePassword releaseKeys.getProperty('storePassword')
                keyAlias releaseKeys.getProperty('keyAlias')
                keyPassword releaseKeys.getProperty('keyPassword')
            }
        }
    }
    defaultConfig {
        applicationId 'org.hdrbridge'
        testInstrumentationRunner 'org.hdrbridge.DeviceRegressionRunner'
        minSdk 26
        targetSdk 35
        versionCode coreVersionCode
        versionName coreVersion
        buildConfigField 'String', 'RELEASE_CERT_SHA256', '"' + releasePin + '"'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                arguments "-DHDRBRIDGE_ANDROID_CODEC_TESTS=${project.findProperty('hdrbridgeCodecTests') ?: 'OFF'}"
                cppFlags '-std=c++20', '-fexceptions', '-frtti'
                targets 'hdrbridge_jni'
            }
        }
    }
    testBuildType 'preview'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' } }
    buildTypes {
        debug { debuggable true; jniDebuggable false }
        release { minifyEnabled false; signingConfig signingConfigs.production }
        preview {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }
    lint { abortOnError true }
}
