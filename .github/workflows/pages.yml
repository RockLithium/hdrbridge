name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "core/src/hdr_transfer.*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    outputs:
      pages-ready: ${{ steps.pages.outcome == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Emscripten 4.0.21
        run: |
          git clone --depth 1 --branch 4.0.21 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.21
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.21
      - name: Build the HDR Bridge Web module
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash web/scripts/build-wasm.sh
          bash web/scripts/assemble-site.sh
      - name: Detect GitHub Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
