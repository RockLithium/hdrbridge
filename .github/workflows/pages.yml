name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "core/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    outputs:
      pages-ready: ${{ steps.pages.outcome == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Emscripten 4.0.21
        run: |
          git clone --depth 1 --branch 4.0.21 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.21
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.21
      - name: Restore WASM build cache
        uses: actions/cache@v4
        with:
          path: |
            web/.cache/downloads
            web/.cache/vcpkg_installed
            web/.cache/build
          key: wasm32-v1-${{ hashFiles('web/vcpkg-overlay/**') }}
          restore-keys: |
            wasm32-
      - name: Build the HDR Bridge Web module
        id: web-build
        continue-on-error: true
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          set -o pipefail
          bash web/scripts/build-wasm.sh 2>&1 | tee web-build.log
          bash web/scripts/assemble-site.sh
      - name: Report Web build failure
        if: steps.web-build.outcome == 'failure'
        run: |
          echo '### Web build failure' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 web-build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          diagnostic="$(tail -n 80 web-build.log)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Web build log::$diagnostic"
          exit 1
      - name: Detect GitHub Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    if: needs.build.outputs.pages-ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
