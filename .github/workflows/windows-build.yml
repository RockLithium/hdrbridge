name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "core/**"
      - "desktop/**"
      - "ports-overlay/**"
      - "scripts/**"
      - "tests/**"
      - "vcpkg.json"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "core/**"
      - "desktop/**"
      - "ports-overlay/**"
      - "scripts/**"
      - "tests/**"
      - "vcpkg.json"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject private image payloads
        shell: pwsh
        run: |
          $extensions = '.hif','.heif','.heic','.jpg','.jpeg','.jpe','.png','.tif','.tiff','.avif','.jxl','.jxr','.wdp','.hdp'
          $publicBranding = @(
            'assets/branding/hdrbridge-logo-source.png',
            'assets/branding/hdrbridge-logo.png',
            'web/public/apple-touch-icon.png',
            'web/public/favicon-32x32.png',
            'web/public/icon-192.png',
            'web/public/icon-512.png'
          )
          $bad = git ls-files | Where-Object {
            $relative = $_.Replace('\\', '/')
            ($extensions -contains [IO.Path]::GetExtension($relative).ToLowerInvariant()) -and
              ($publicBranding -notcontains $relative)
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Host "Unexpected image payload: $($_.FullName)" }
            throw 'Camera fixtures and generated images are not allowed in the public repository.'
          }

      - name: Detect MSVC toolset
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationVersion
          if (-not $version) { throw 'MSVC toolset was not found.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore installed vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ steps.msvc.outputs.version }}-${{ hashFiles('vcpkg.json', 'ports-overlay/**', 'scripts/bootstrap-vcpkg-local.ps1') }}

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: .\scripts\bootstrap-vcpkg-local.ps1

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\.tools\vcpkg\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg_installed"
          -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}\ports-overlay"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
